apiVersion: apps/v1
kind: Deployment
metadata:
  name: openingrecommender-app
  labels:
    app: openingrecommender
spec:
  replicas: 1
  selector:
    matchLabels:
      app: openingrecommender
  template:
    metadata:
      labels:
        app: openingrecommender
    spec:
      containers:
      - name: openingrecommender-container
        image: openingrecommender-app:latest  # Use local image
        imagePullPolicy: IfNotPresent
        ports:
          - containerPort: 8501
        envFrom:
          - secretRef:
              name: openingrecommender-secrets 

---
apiVersion: v1
kind: Service
metadata:
  name: openingrecommender-service
spec:
  type: LoadBalancer
  selector:
    app: openingrecommender
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501